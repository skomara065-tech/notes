<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; width: 300px; padding: 15px; margin: 0; background: #fafafa; }
    h3 { margin-top: 0; color: #111; }
    .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; margin-block: 8px; color: white; transition: 0.2s; }
    .btn-start { background-color: #2563eb; }
    .btn-start:hover { background-color: #1d4ed8; }
    .btn-stop { background-color: #dc2626; }
    .btn-stop:hover { background-color: #b91c1c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-grp { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 4px; color: #444; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .status { font-size: 12px; text-align: center; margin-top: 10px; color: #666; font-weight: 500; }
    .pulse { width: 8px; height: 8px; background: red; border-radius: 50%; display: inline-block; animation: blink 1s infinite; margin-right: 6px; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
</head>
<body>
  <h3>Note Taker AI</h3>
  
  <div class="input-grp">
    <label>Backend URL</label>
    <input type="text" id="backendUrl" placeholder="https://your-app.run.app" />
  </div>
  
  <div class="input-grp">
    <label>Notion API Key</label>
    <input type="text" id="notionApiKey" placeholder="secret_..." />
  </div>
  
  <div class="input-grp">
    <label>Notion Page ID</label>
    <input type="text" id="notionPageId" placeholder="1234567890abcdef..." />
  </div>

  <button id="btnStart" class="btn btn-start">Start Listening</button>
  <button id="btnStop" class="btn btn-stop" style="display: none;">Stop & Save to Notion</button>

  <div id="statusText" class="status">Idle. Click start to begin.</div>

  <script src="popup.js"></script>
</body>
</html>
